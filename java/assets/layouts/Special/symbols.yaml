name: "Symbols"
attributes:
  shiftable: false
rows:
  - letters: "1 2 3 4 5 6 7 8 9 0"
    numRowMode: Hideable
  - letters: "@ # $ & _ - ( ) = %"
  - letters:
      - "$shift"
      - "\""
      - "*"
      - "'"
      - ":"
      - "/"
      - "!"
      - "?"
      - "+"
      - "$delete"
  - bottom:
      - "$alphabet"
      - ","
      - {type: base, spec: "!icon/space_key_for_number_layout|!code/key_space", attributes: { style: Spacebar, width: Grow, showPopup: false, longPressEnabled: true, moreKeyMode: OnlyExplicit }}
      - "."
      - "$enter"
