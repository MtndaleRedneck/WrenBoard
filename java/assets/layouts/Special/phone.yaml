name: Phone
# WrenBoard 1.6 (item 10, pixel spec v1.1 items 64-65, Ezzy's approved mock-ups 13/14): SwiftKey's compact
# 4 x 6 pad, the same for number and phone fields (phone fields use this file). No letters on the keys, no arrow row,
# no prediction strip or toolbar (UixManager), 576 px tall at 1080x2316 (KeyboardSizingCalculator).
# Long-press 0 gives +, long-press ; gives : (hint " " keeps those off the key face, as on SwiftKey).
# Columns at 1080 px: three 216 px cells, then 140 / 141 / 151 px (keys 210, 134, 135, 145 px + gaps).
numberRowMode: AlwaysDisabled
bottomRowHeightMode: Flexible
bottomRowWidthMode: Identical
rowHeightMode: FillHeight
overrideWidths:
  Custom1: 0.2
  Custom2: 0.12963
  Custom3: 0.13056
  Custom4: 0.13981
attributes: &globalAttrs
  width: Custom1
  showPopup: false
  moreKeyMode: OnlyExplicit
  useKeySpecShortcut: false
  style: Normal
  shiftable: false
  labelFlags:
    alignLabelOffCenter: false
    hasHintLabel: false
rows:
  - letters:
      - "1"
      - "2"
      - "3"
      - {type: base, spec: "(", attributes: {width: Custom2}}
      - {type: base, spec: ")", attributes: {width: Custom3}}
      - {type: base, spec: ",", attributes: {width: Custom4}}
    splittable: false
  - letters:
      - "4"
      - "5"
      - "6"
      - {type: base, spec: "+", attributes: {width: Custom2}}
      - {type: base, spec: "-", attributes: {width: Custom3}}
      - {type: base, spec: ";", moreKeys: [":"], hint: " ", attributes: {width: Custom4}}
    splittable: false
  - letters:
      - "7"
      - "8"
      - "9"
      - {type: base, spec: "/", attributes: {width: Custom2}}
      - {type: base, spec: "N", attributes: {width: Custom3}}
      - {type: delete, attributes: {width: Custom4}}
    splittable: false
  - bottom:
      - {type: base, spec: "*"}
      - {type: base, spec: "0", moreKeys: "!noPanelAutoMoreKey!,+", hint: " "}
      - {type: base, spec: "#"}
      - {type: base, spec: ".", attributes: {width: Custom2}}
      # SwiftKey's blank key: a space with no glyph
      - {type: base, spec: " |!code/key_space", attributes: {width: Custom3, longPressEnabled: false}}
      - {type: enter, attributes: {width: Custom4}}
    attributes: *globalAttrs
    splittable: false
