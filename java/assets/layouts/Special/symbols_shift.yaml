name: "Symbols (Shifted)"
numberRowMode: AlwaysDisabled
attributes:
  shiftable: false
rows:
  - letters:
      # £ € ¥ ¢ © ® ™ ~ ¿
      - "£"
      - "€"
      - "¥"
      - "¢"
      - "©"
      - "®"
      - "™"
      - "~"
      - "¿"
  - letters:
      # Tab (arrow-into-bar glyph), then [ ] { } < > ^ ¡
      - type: base
        spec: "⇥|!code/key_tab"
      - "["
      - "]"
      - "{"
      - "}"
      - "<"
      - ">"
      - "^"
      - "¡"
  - letters:
      # 123 (shift back), then ` ; ÷ \ | ¦ ¬, then delete
      - "$shift"
      - "`"
      - ";"
      - "÷"
      - "\\"
      - "|"
      - "¦"
      - "¬"
      - "$delete"
  - bottom:
      - "$alphabet"
      - {type: base, spec: "!icon/space_key_for_number_layout|!code/key_space", attributes: { style: Spacebar, width: Grow, showPopup: false, longPressEnabled: true, moreKeyMode: OnlyExplicit }}
      - "×"
      - "§"
      - "¶"
      - "°"
      - "$enter"
