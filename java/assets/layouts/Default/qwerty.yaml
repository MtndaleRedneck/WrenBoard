name: QWERTY
# SwiftKey parity (spec v1.1 item 20): shift/backspace keys are 0.1241 x keyboard width (47.6 dp at 384 dp,
# 134 px on the S22 Ultra); the layout cell adds the key gap, so the cell is 0.1296. The leftover becomes the
# inner gaps between shift/Z and M/backspace.
overrideWidths:
  FunctionalKey: 0.1296
rows:
  - letters: q w e r t y u i o p
  - letters: a s d f g h j k l
  - letters: z x c v b n m
