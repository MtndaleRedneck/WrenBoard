// Report-only Android Lint SARIF enablement - applied with `gradle -I <this file> lint`.
// Zero product-file changes. abortOnError=false: findings never fail the build.
// Handles app modules, library modules, and app-at-root layouts (WrenBoard).
gradle.projectsLoaded {
    rootProject {
        allprojects { p ->
            ['com.android.application', 'com.android.library'].each { pluginId ->
                p.plugins.withId(pluginId) {
                    def android = p.extensions.findByName('android')
                    if (android != null) {
                        android.lint {
                            sarifReport = true
                            htmlReport = true
                            abortOnError = false
                            checkReleaseBuilds = false
                            // lint 8.10.1's Compose detector crashes on Kotlin 2.1 metadata (kotlinx-metadata max 2.0.0).
                            // Waiver scoped to the module(s) listed in -PlintWaiverModules (default: voiceinput-shared,
                            // where the crash was observed). Re-enable when AGP/lint bundles kotlinx-metadata >= 2.1.
                            def waiver = (p.rootProject.findProperty('lintWaiverModules') ?: ':voiceinput-shared').toString().split(',')*.trim()
                            if (waiver.contains(p.path)) {
                                disable.add('CoroutineCreationDuringComposition')
                            }
                        }
                    }
                }
            }
        }
    }
}
