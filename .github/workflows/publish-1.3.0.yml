name: publish-1.3.0
on:
  push:
    branches: [release-publish-1.3.0]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: WrenBoard-baseline-apk
          run-id: 41284645466
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: art
      - name: Verify exact signed bytes
        run: |
          set -e
          ls -l art
          f=$(ls art/*.apk | head -1)
          sum=$(sha256sum "$f" | cut -d' ' -f1)
          size=$(stat -c %s "$f")
          echo "file=$f sha256=$sum size=$size"
          test "$sum" = "1f739368556caf8451c47e67b6b0b65cf45548e9bc19099bc9d6c4c13793f6de"
          test "$size" = "129312668"
          cp "$f" WrenBoard-1.3.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs WrenBoard-1.3.apk | tee signer.txt
          grep -q 'ad41ab713027aca87389019721d102d67cacaae349cc625aa14f76240801f7fc' signer.txt
      - name: Guard - no existing v1.3.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.3.0 >/dev/null 2>&1; then echo "v1.3.0 already exists"; exit 1; fi
      - name: Create release v1.3.0 at a574d1f25a660d488874124f1864743397caff33
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.3.0 WrenBoard-1.3.apk --target a574d1f25a660d488874124f1864743397caff33 --title "WrenBoard 1.3" --notes-file .github/release-notes-1.3.0.md --latest
      - name: Readback - assert the published bytes match the signed bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh api repos/${{ github.repository }}/releases/latest --jq '{tag:.tag_name,draft:.draft,pre:.prerelease,assets:[.assets[]|{name,size,url:.browser_download_url}]}'
          curl -sSL -o dl.apk "https://github.com/${{ github.repository }}/releases/download/v1.3.0/WrenBoard-1.3.apk"
          dsum=$(sha256sum dl.apk | cut -d' ' -f1)
          dsize=$(stat -c %s dl.apk)
          echo "readback sha256=$dsum size=$dsize"
          test "$dsum" = "1f739368556caf8451c47e67b6b0b65cf45548e9bc19099bc9d6c4c13793f6de"
          test "$dsize" = "129312668"
