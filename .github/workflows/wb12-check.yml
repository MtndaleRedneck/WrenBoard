name: wb12-check
# WrenBoard 1.2 checkpoint checks: builds the DEBUG APK (x86_64 only, for the emulator) and runs
# tools/wb12-check.sh, which drives the keyboard through WBDBG logcat geometry and saves screenshots.
# The debug build is never published; release builds stay in build.yml.
on:
  push:
    branches: [wrenboard-1.2]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      legs:
        description: "comma list of legs (blank = all)"
        required: false
        default: ""
      note:
        description: "free text, ignored"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      VERSION_NAME: 1.2.0-check
      VERSION_CODE: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Init build submodules
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build stable DEBUG APK (x86_64 only)
        run: ./gradlew --no-daemon assembleStableDebug -Pandroid.injected.build.abi=x86_64 -Pandroid.injected.testOnly=false
      - name: Build ime-target APK
        run: bash tools/ime-target/build.sh
      - name: Stage APKs at fixed paths
        run: |
          # with an injected ABI, AGP may leave the APK under build/intermediates instead of build/outputs
          find build -name '*.apk' -not -path '*/ime-target/*' -print | sed 's/^/::notice::apk /'
          APK=$(find build/outputs/apk build/intermediates -name '*.apk' 2>/dev/null | grep -i debug | grep -v -i androidTest | head -1)
          [ -n "$APK" ] || { echo "::error::no debug APK found"; exit 1; }
          cp "$APK" wb-debug.apk
          ls -la wb-debug.apk tools/ime-target/out/imetarget.apk
          python3 -c 'import PIL' 2>/dev/null || python3 -m pip install --quiet --break-system-packages pillow || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run WrenBoard 1.2 checks on the emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          heap-size: 576M
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: WB_LEGS="${{ inputs.legs }}" WB_LOCAL_APK_URL=http://127.0.0.1:8765/wb-debug.apk bash tools/wb12-check.sh wb-debug.apk tools/ime-target/out/imetarget.apk
      - name: Unit tests (update prompt status, swipe delete, starter words)
        if: always()
        run: |
          ./gradlew --no-daemon testStableDebugUnitTest -Pandroid.injected.build.abi=x86_64 --tests 'org.futo.inputmethod.updates.UpdateAttemptsTest' --tests 'org.futo.inputmethod.latin.uix.actions.clipboard.WrenSwipeJudgeTest' --tests 'org.futo.inputmethod.engine.general.WrenStarterWordsTest'
      - name: Collect unit test results
        if: always()
        run: |
          mkdir -p shots/unit-tests
          cp build/test-results/testStableDebugUnitTest/*.xml shots/unit-tests/ 2>/dev/null || true
          python3 - <<'PY' | tee shots/unit-tests/summary.txt
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("shots/unit-tests/*.xml"):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0)); e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
              for c in r.iter("testcase"):
                  bad = c.find("failure") is not None or c.find("error") is not None
                  print(("FAIL" if bad else "PASS") + ": " + c.get("classname", "") + "." + c.get("name", ""))
          print(f"UNIT TESTS: {t} run, {f} failed, {e} errors, {s} skipped")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wb12-shots
          path: shots/
          retention-days: 14
      - name: Results
        if: always()
        run: |
          cat shots/results.txt || true
          grep -E '^(FAIL|RESULT)' shots/results.txt 2>/dev/null | head -40 | sed 's/^/::warning::/' || true
