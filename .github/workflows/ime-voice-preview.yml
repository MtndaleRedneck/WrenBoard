name: ime-voice-preview
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "build run id to take the DEBUG preview APK from"
        required: true
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get debug preview APK from build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download "${{ inputs.run_id }}" -n WrenBoard-debug-preview-apk -D apk
          ls -la apk/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture voice preview frames
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash tools/ime-voice-preview.sh apk/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ime-voice-preview-shots
          path: shots/
          retention-days: 14
