name: wren17-signed-review
# Review only. No raw APK upload, release, tag or repository-write permission.
# Deliberately dispatch-only while prepared; no action until review gates settle.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'MtndaleRedneck/WrenBoard' && github.ref == 'refs/heads/main'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # Exact-source 1.7 signed candidate. Publishing is outside this workflow.
      VERSION_NAME: 1.7.0
      VERSION_CODE: "8"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: 1952c53560360bf48f92e236591c499894900540
          fetch-depth: 1
      - name: Verify exact reviewed app source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1952c53560360bf48f92e236591c499894900540
          test -z "$(git status --porcelain)"
      - name: Init build submodules (bundled English voice model cleared, provenance in README-WRENBOARD.md)
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - name: Init swipe model submodule (FUTO Swipe weights, FUTO Model Weights License 1.0; notice in Settings > Credits)
        run: |
          set -e
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init java/assets/futo-swipe
          cd java/assets/futo-swipe
          git lfs pull --include="honorable_sturgeon/*,hungry_jellyfish/*,magic_macaw/*"
          # demo animation and model card are not app assets; LICENSE.md stays (shown in Credits)
          rm -rf animations README.md .gitattributes
          for f in honorable_sturgeon/model_fp32.pte magic_macaw/model_fp32.pte hungry_jellyfish/context_lm.pte; do
            sz=$(stat -c%s "$f"); echo "$f $sz bytes"
            if [ "$sz" -lt 100000 ]; then echo "swipe model $f is an LFS pointer, not the weights"; exit 1; fi
          done
          echo "725242bab5d14345e96ff214e8de2bfbc1f962c232d320df9c24cb82ffd1fbaf  honorable_sturgeon/model_fp32.pte" | sha256sum -c -
          echo "01eaf16ac4bc0f1ed0698c240807f0e95e6d427bcf6de04983ffc50736744d85  magic_macaw/model_fp32.pte" | sha256sum -c -
          echo "74d29f56a513c0c60abcd43df3b16a6b68925cdf4e97e51b094a5275ec2810d7  hungry_jellyfish/context_lm.pte" | sha256sum -c -
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK (runner-provided Android SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true
      - name: Signing setup
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf 'storeFile=%s\nkeyAlias=wrenboard\nkeyPassword=%s\nstorePassword=%s\n' "$RUNNER_TEMP/release.keystore" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          # Fail-closed signing gate: fail closed if the release key is absent (build.gradle would otherwise
          # silently sign release with the committed debug keystore java/shared.keystore)
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 empty"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD empty"; exit 1; }
          test -s "$RUNNER_TEMP/release.keystore" || { echo "release keystore empty"; exit 1; }
          test -s keystore.properties || { echo "keystore.properties missing"; exit 1; }
      - name: Build stable release APK
        env:
          # WrenBoard 1.5 (item 1): KLIPY GIF test key, owner-authorized Nov 3; empty = placeholder state
          KLIPY_APP_KEY: ${{ secrets.KLIPY_APP_KEY }}
        run: ./gradlew --no-daemon assembleStableRelease
      - name: Cleanup signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"
      # Independent review receives encrypted bytes only. No draft or release mutation.
      # Private age identities never enter CI. Only final manual review may publish.
      # Signer pinned to the WrenBoard 1.5.0 certificate; any mismatch fails before upload.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
      - name: Verify signed candidate and encrypt review copy
        env:
          REVIEWER_RECIPIENT: age14glqdym3cnvmqzdzmdd02gkppqwg0epmug0040d99juja2ct856s3mcxqa
          AGE_RECIPIENT: age10y8z2hrk99pat4as2c0fffp6svqsjql98x0qcun02dsljvs3uvvs8cvnx6
          EXPECTED_CERT_SHA256: ad41ab713027aca87389019721d102d67cacaae349cc625aa14f76240801f7fc
        run: |
          set -euo pipefail
          trap 'rc=$?; rm -f build/outputs/apk/stable/*/*.apk signer.txt badging.txt; if [ "$rc" -ne 0 ]; then rm -rf enc; fi' EXIT
          test -n "$AGE_RECIPIENT"
          sudo apt-get update -q
          sudo apt-get install -y -q age
          age --version
          shopt -s nullglob
          apks=(build/outputs/apk/stable/release/*.apk)
          test "${#apks[@]}" -eq 1 || { echo "expected exactly 1 release APK, got ${#apks[@]}"; exit 1; }
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs "${apks[0]}" > signer.txt
          python3 - "$EXPECTED_CERT_SHA256" signer.txt <<'PY_SIGNER'
          import re
          import sys
          from pathlib import Path
          
          pin = sys.argv[1]
          if not re.fullmatch(r"[0-9a-f]{64}", pin):
              raise SystemExit("invalid certificate pin")
          blocks = {}
          for line in Path(sys.argv[2]).read_text().splitlines():
              if "certificate DN" not in line and "certificate SHA-256 digest" not in line:
                  continue
              match = re.fullmatch(r"(Signer #[1-9][0-9]* |V[23] Signer: )certificate (DN|SHA-256 digest): (.+)", line)
              if not match:
                  raise SystemExit("unknown certificate output")
              identity, field, value = match.groups()
              block = blocks.setdefault(identity, {})
              if field in block:
                  raise SystemExit("duplicate certificate field")
              block[field] = value
          if not blocks:
              raise SystemExit("missing certificate output")
          old = [identity for identity in blocks if identity.startswith("Signer #")]
          if old and set(blocks) != {"Signer #1 "}:
              raise SystemExit("multiple or mixed signer identities")
          # In the observed scheme layout each V2/V3 block describes its scheme's
          # certificate. Equal SHA-256 values identify the same certificate across schemes.
          for block in blocks.values():
              if set(block) != {"DN", "SHA-256 digest"}:
                  raise SystemExit("incomplete certificate block")
              if not re.fullmatch(r"[0-9a-f]{64}", block["SHA-256 digest"]):
                  raise SystemExit("invalid certificate digest")
              if block["SHA-256 digest"] != pin:
                  raise SystemExit("signer mismatch")
          if len({block["DN"] for block in blocks.values()}) != 1:
              raise SystemExit("inconsistent scheme certificate identity")
          print("exact certificate pin verified; one certificate identity")
          PY_SIGNER
          "$bt/aapt2" dump badging "${apks[0]}" > badging.txt
          grep -m1 '^package:' badging.txt
          python3 - <<'PY_METADATA'
          import re
          from pathlib import Path
          line = next(x for x in Path('badging.txt').read_text().splitlines() if x.startswith('package:'))
          fields = dict(re.findall(r"(\w+)='([^']*)'", line))
          assert fields.get('name') == 'com.wrenboard.keyboard', 'package mismatch'
          assert fields.get('versionName') == '1.7.0', 'version mismatch'
          assert fields.get('versionCode') == '8', 'version code mismatch'
          PY_METADATA
          cat > "$RUNNER_TEMP/scanner-requirements.txt" <<'SCANNER_LOCK'
          alembic==1.20.1 --hash=sha256:9970712cfb81ea26c8658d378aaa5b8f6ff9146e5bb111d70497c164016cf598
          androguard==4.1.4 --hash=sha256:6265a6d4007401cf5a62a98fa99a1c2994644d4311da031a5398efe3bcaa63b0
          apkInspector==1.3.7 --hash=sha256:fa3242baa7ba8e0eecd20a2fcf427fcfd34f4043902542d12110c7297649c590
          asn1crypto==1.5.1 --hash=sha256:db4e40728b728508912cbb3d44f19ce188f218e9eba635821bb4b68564f8fd67
          asttokens==3.0.2 --hash=sha256:9da13157f5b28becde0bd374fc677dcd3c290614264eff096f167c469cd9f933
          cffi==2.1.1 --hash=sha256:194cffa889098ced9976c3fc6340305e43f6303657d298da55366907c05c22d6
          click==8.5.1 --hash=sha256:8bb5376d2006950386f8c6427613334a2acadc5f559cb80e638d00b4df957e37
          colorama==0.4.6 --hash=sha256:4f1d9991f5acc0ca119f9d443620b77f9d6b33703e51011c16baf57afb285fc6
          cryptography==50.0.2 --hash=sha256:1981f1db4630889b9ef7803fadef12b056f428cb6b85c27ba57b774793b6093c
          dataset==2.0.0 --hash=sha256:c08354c068002c2beb7811b37b8abf434e1fc333898f8cfc2be32df3f14099b3
          decorator==5.3.1 --hash=sha256:f47fe6fdbd2edd623ecfe36875d37aba411624e2670dd395dddae1358689bb3c
          exceptiongroup==1.3.1 --hash=sha256:a7a39a3bd276781e98394987d3a5701d0c4edffb633bb7a5144577f82c773598
          executing==2.3.0 --hash=sha256:736e859c9f8701f11fcf516856f26f562e04776387824b43a35a1dfe21c84122
          greenlet==3.5.6 --hash=sha256:eed88b64a5e5da72d6a71cdc5aaeefaa5ced9b748f8d19f89800b339961dad39
          ipython==8.39.0 --hash=sha256:bb3c51c4fa8148ab1dea07a79584d1c854e234ea44aa1283bcb37bc75054651f
          jedi==0.20.1 --hash=sha256:0fb16d86c4a4c73c37ba518c77419975e30fcc620658a8d14fbb5720cdd34142
          loguru==0.7.3 --hash=sha256:31a33c10c8e1e10422bfd431aeb5d351c7cf7fa671e3c4df004162264b28220c
          lxml==6.1.3 --hash=sha256:f6449672f9c93316deb5e2839e18931f468670e44d5bd9b1301a5a9655d45c07
          Mako==1.4.3 --hash=sha256:723296007c870bfd6b3f0c3230dba7198096e5269297ebf5e4eff9e7ffa39d4f
          MarkupSafe==3.0.4 --hash=sha256:d1aca03ede943eb80ab3d63bb082c84b7aab85ea83bd0fd0c200260945fb49d9
          matplotlib-inline==0.2.2 --hash=sha256:3c821cf1c209f59fb2d2d64abbf5b23b67bcb2210d663f9918dd851c6da1fcf6
          mutf8==1.1.0 --hash=sha256:072ad993d20b244755a8d6ab0ba6fee5c974741dd0acf96df6cc585f0c3c61ad
          networkx==3.4.2 --hash=sha256:df5d4365b724cf81b8c6a7312509d0c22386097011ad1abe274afd5e9d3bbc5f
          parso==0.8.7 --hash=sha256:a8926eb2a1b915486941fdbd31e86a4baf88fe8c210f25f2f35ecec5b574ca1c
          pexpect==4.9.0 --hash=sha256:7236d1e080e4936be2dc3e326cec0af72acf9212a7e1d060210e70a47e253523
          prompt_toolkit==3.0.53 --hash=sha256:01c0891d7f9237d5e339f7d3e42cdae80b7534abb1c7c0e3352efba6231492f2
          ptyprocess==0.7.0 --hash=sha256:4b41f3967fce3af57cc7e94b888626c18bf37a083e3651ca8feeb66d492fef35
          pure_eval==0.2.4 --hash=sha256:96cae060a313cfaad51bb761278bfb0e62dc0248d9315a81173752dc546cd37a
          pycparser==3.11 --hash=sha256:51d5a8ba2be0bbe440b99d2112604c95bbbc3c2748a64260186c541e1729cd80
          pydot==4.0.1 --hash=sha256:869c0efadd2708c0be1f916eb669f3d664ca684bc57ffb7ecc08e70d5e93fee6
          Pygments==2.21.0 --hash=sha256:2363c69b61c4a97c838da3b130dcd6468f4848992b21a82f2a63ec34377137d9
          pyparsing==3.3.3 --hash=sha256:ece8c00a69cf01b45d0b1dedabb469c90d8caf996d4fda40f147627a122849a4
          PyYAML==6.0.3 --hash=sha256:9c7708761fccb9397fe64bbc0395abcae8c4bf7b0eac081e12b809bf47700d0b
          SQLAlchemy==2.0.57 --hash=sha256:5108313e44bc1e08a857d36f7f7f7f5eae23687153c5ad21cb6800ac6cb67510
          stack-data==0.6.3 --hash=sha256:d5558e0c25a4cb0853cddad3d77da9891a08cb85dd9f9f91b9f8cd66e511e695
          tomli==2.5.0 --hash=sha256:32a7b79ac57a2e83670ce329ccf675798bc5a2094783a63676866b70503f2e2b
          traitlets==5.16.1 --hash=sha256:f775618166caa0396c8e337099240f2bd3e5e917d203b2e6fbe21a58d3cb1f6b
          typing_extensions==4.16.0 --hash=sha256:481caa481374e813c1b176ada14e97f1f67a4539ce9cfeb3f350d78d6370c2e8
          wcwidth==0.9.4 --hash=sha256:b185c8b927b23af2721be1783499d1cfa5c028b098b0858951b4ae224477f1c2
          SCANNER_LOCK
          python3 -m pip install --quiet --require-hashes --only-binary=:all: -r "$RUNNER_TEMP/scanner-requirements.txt"
          python3 tools/dex_wbdbg_scan.py --apk "${apks[0]}" --mode final --policy tools/dex_marker_policy.txt
          mkdir -p enc
          f="${apks[0]}"
          sha256sum "$f" | sed 's#  .*/#  #' > enc/SHA256SUMS
          age -r "$AGE_RECIPIENT" -r "$REVIEWER_RECIPIENT" -o "enc/$(basename "$f").age" "$f"
          test -s "enc/$(basename "$f").age"
          cp signer.txt enc/SIGNER.txt
          # Bind encrypted output to exact source, version, signer, and artifact digest.
          printf 'source=%s\nsourceTree=%s\nversionName=1.7.0\nversionCode=8\nsignerSha256=%s\napkSha256=%s\nencryptedSha256=%s\nrawApkPublished=false\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$EXPECTED_CERT_SHA256" "$(sha256sum "$f" | cut -d ' ' -f1)" "$(sha256sum "enc/$(basename "$f").age" | cut -d ' ' -f1)" > enc/PROVENANCE.txt
          rm -f build/outputs/apk/stable/*/*.apk signer.txt badging.txt
          cat enc/SHA256SUMS enc/SIGNER.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WrenBoard-apk-encrypted
          path: |
            enc/*.apk.age
            enc/SHA256SUMS
            enc/SIGNER.txt
            enc/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 3
      - name: Cleanup temporary packaging files
        if: always()
        run: rm -f build/outputs/apk/stable/*/*.apk signer.txt badging.txt
