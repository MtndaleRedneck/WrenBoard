name: backup-proto
on:
  workflow_dispatch:
jobs:
  proto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build throwaway prototype APK
        run: bash tools/backup-proto/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Backup mechanics on emulator (local transport)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: bash tools/backup-proto-test.sh tools/backup-proto/out/bkproto.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-proto-results
          path: out/
