name: ime-verify
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "build run id to take the APK from (blank = latest successful build)"
        required: false
        default: ""
      focus:
        description: "learn = learn-restore + real-data export legs; upgrade = published 1.0 -> branch APK install-over data preservation"
        required: false
        default: ""
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Init voice-model submodule (dictation engine check only)
        run: git submodule update --init voiceinput-shared/src/main/ml
      - name: Install pillow for keyboard geometry
        run: pip install --quiet pillow
      - name: Transcribe known sample through bundled engine + model
        run: |
          set -e
          bash tools/whisper-cli/build.sh
          ls -la voiceinput-shared/src/main/ml/
          MODEL=$(ls voiceinput-shared/src/main/ml/*.bin* | head -1)
          echo "model: $MODEL"
          sha256sum "$MODEL" | tee dictation-engine.txt
          tools/whisper-cli/out/whisper-cli "$MODEL" tools/samples/jfk.wav | tee -a dictation-engine.txt
          if grep -qi "fellow Americans" dictation-engine.txt; then
            echo "DICTATION-ENGINE: PASS" | tee -a dictation-engine.txt
          else
            echo "DICTATION-ENGINE: FAIL" | tee -a dictation-engine.txt
            exit 1
          fi
      - name: Get APK from build run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID="${{ inputs.run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh run list --workflow build.yml --status success --limit 1 --json databaseId -q '.[0].databaseId')
          fi
          echo "Using build run $RID"
          gh run download "$RID" -n WrenBoard-baseline-apk -D apk
          ls -la apk/
      - name: Get published 1.0 APK (upgrade focus only)
        if: inputs.focus == 'upgrade'
        run: |
          mkdir -p apk10
          curl -L -o apk10/WrenBoard-1.0.apk https://github.com/MtndaleRedneck/WrenBoard/releases/download/v1.0.0/WrenBoard-1.0.apk
          echo "d8efe5c5013e3f3493aeeb2f95eb30f715055ce4750387c18da2f4831ca072e8  apk10/WrenBoard-1.0.apk" | sha256sum -c -
          ls -la apk10/
      - name: Generate import-regression fixtures
        run: python3 tools/make_fixtures.py tools/ime-target/fixtures
      - name: Build ime-target APK (deterministic EditText target)
        run: ASSETS_DIR="$PWD/tools/ime-target/fixtures" bash tools/ime-target/build.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
      - name: Run installed-IME verification on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            if [ "${{ inputs.focus }}" = upgrade ]; then
              WB_FOCUS=upgrade bash tools/ime-verify.sh apk10/*.apk tools/ime-target/out/imetarget.apk apk/*.apk
            else
              WB_FOCUS=${{ inputs.focus }} bash tools/ime-verify.sh apk/*.apk tools/ime-target/out/imetarget.apk
            fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ime-verify-shots
          path: |
            shots/
            dictation-engine.txt
          retention-days: 30
      - name: Verification results
        if: always()
        run: |
          cat dictation-engine.txt || true
          echo "-----"
          cat shots/results.txt || true
