name: wren110-offline
# dependency and tool inventory for the reviewed 1.10 fixture; build 3
on:
  push:
    branches: [instinct1/release-1.10.0-inventory]
    paths: [.github/workflows/wren110-offline.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wren110-offline
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'MtndaleRedneck/WrenBoard' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: 1.10.0 # r1
      VERSION_CODE: '11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build dependencies
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - name: Reuse shipped swipe weights for regression fixture
        run: |
          curl --http1.1 -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 180 -o /tmp/wren16.apk https://github.com/MtndaleRedneck/WrenBoard/releases/download/v1.6.0/WrenBoard-1.6.apk
          echo '89e3c3a7f756816bb36f391a4179405942738be9bd2ff12f3f9c4c87459f453f  /tmp/wren16.apk' | sha256sum -c -
          python3 - <<'PYWEIGHTS'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/wren16.apk') as z:
              files=[n for n in z.namelist() if n.startswith('assets/futo-swipe/') and not n.endswith('/')]
              assert files, 'Shipped weights absent'
              for n in files:
                  p=Path('java')/n
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(n))
          PYWEIGHTS
          rm /tmp/wren16.apk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and image tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          python3 -m pip install --break-system-packages pillow
          sudo apt-get install -y -q ffmpeg
      - name: Phase N dry-run graph, online compile pass, offline tests
        run: |
          mkdir -p off
          G="./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx5g -Dfile.encoding=UTF-8 -Pkotlin.compiler.execution.strategy=in-process -Pandroid.injected.build.abi=x86_64 -Pandroid.injected.testOnly=false"
          N1="assembleStableDebug assembleStableDebugAndroidTest compileStableDebugUnitTestKotlin compileStableDebugUnitTestJavaWithJavac :voiceinput-shared:assembleDebug :voiceinput-shared:compileDebugUnitTestKotlin :voiceinput-shared:compileDebugUnitTestJavaWithJavac"
          $G --dry-run $N1 > off/n1-dryrun.txt 2>&1 || echo "dryrun exit $?"
          echo "tasks in dry run: $(grep -c '^:' off/n1-dryrun.txt)"
          echo "Test-execution tasks in dry run (expect none):"; grep -E '^:[A-Za-z:-]*:(test[A-Za-z]*UnitTest|connected[A-Za-z]*)( |$)' off/n1-dryrun.txt | tee off/n1-test-tasks.txt || true
          $G $N1 > off/n1-run.log 2>&1; echo "N1 exit $?"; tail -3 off/n1-run.log
          ls ~/.gradle/caches/modules-2/files-2.1 | wc -l > off/cache-module-dirs.txt; find ~/.gradle/caches/modules-2/files-2.1 -type f ! -name '*.lock' | wc -l > off/cache-files.txt; cat off/cache-module-dirs.txt off/cache-files.txt
          $G --offline testStableDebugUnitTest :voiceinput-shared:testDebugUnitTest > off/phase-o.log 2>&1; echo "PhaseO exit $?"; tail -8 off/phase-o.log
          $G --offline --dry-run testStableDebugUnitTest :voiceinput-shared:testDebugUnitTest > off/phase-o-dryrun.txt 2>&1 || true
          grep -c '^:' off/phase-o-dryrun.txt
          mkdir -p off/xml; cp -r build/test-results off/xml/app 2>/dev/null; cp -r voiceinput-shared/build/test-results off/xml/vi 2>/dev/null; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wren110-offline
          path: |
            off/n1-dryrun.txt
            off/n1-test-tasks.txt
            off/phase-o-dryrun.txt
            off/cache-*.txt
            off/phase-o.log
            off/xml/**/*.xml
          retention-days: 3
