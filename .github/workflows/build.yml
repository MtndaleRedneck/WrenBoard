name: build
on:
  push:
    paths-ignore:
      - 'tools/**'
      - '.github/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.1.0
      VERSION_CODE: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Init build submodules (swipe weights excluded; bundled English voice model cleared, provenance in README-WRENBOARD.md)
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK (runner-provided Android SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Signing setup
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf 'storeFile=%s\nkeyAlias=wrenboard\nkeyPassword=%s\nstorePassword=%s\n' "$RUNNER_TEMP/release.keystore" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
      - name: Build stable release APK
        run: ./gradlew --no-daemon assembleStableRelease
      - name: Build stable DEBUG preview APK (layout screenshots only, never published)
        run: ./gradlew --no-daemon assembleStableDebug
      - name: Cleanup signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: WrenBoard-baseline-apk
          path: build/outputs/apk/stable/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: WrenBoard-debug-preview-apk
          path: build/outputs/apk/stable/debug/*.apk
          retention-days: 3
