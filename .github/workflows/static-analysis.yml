# Phase-2 static analysis: Android Lint + detekt, report-only.
# Findings upload to GitHub code scanning (Security tab); the job NEVER fails
# on findings (lint abortOnError=false via init script; detekt's findings exit
# code is accepted explicitly). Tool/configuration failures DO fail the step -
# no blanket || true on analysis runs.
# No product/build files touched: lint SARIF output is injected by an init
# script; detekt runs as the official standalone CLI (no Gradle plugin, no
# build-file changes). detekt CLI pinned: v1.23.8 -all.jar, sha256
# self-measured 2026-11-23 (detekt publishes no checksums); re-verified here.
name: Static Analysis (lint/detekt)

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'   # weekly, Monday 05:17 UTC

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: false   # never cancel builders' runs; wait our turn

jobs:
  lint:
    name: Android Lint (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION_NAME: 1.10.0   # root build.gradle requires VERSION_CODE/VERSION_NAME env
      VERSION_CODE: "11"
    permissions:
      security-events: write   # SARIF upload
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Init build submodules (same set as build.yml; gradle configure needs them)
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK (runner-provided Android SDK; gradle configure requires ndkVersion)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0
      # abortOnError=false (init script) means findings cannot fail this step;
      # a nonzero exit here is a tool/configuration failure and fails honestly.
      - name: Run Android Lint (report-only)
        run: ./gradlew -I .github/analysis/lint-sarif.init.gradle lint --continue
      - name: Collect lint reports
        if: always()
        run: |
          mkdir -p /tmp/sarif-lint /tmp/html-lint
          find . -path '*/build/reports/lint-results*.sarif' -exec cp --backup=numbered {} /tmp/sarif-lint/ \; || true
          find . -path '*/build/reports/lint-results*.html' -exec cp --backup=numbered {} /tmp/html-lint/ \; || true
          echo "lint sarif files: $(ls /tmp/sarif-lint | wc -l), html files: $(ls /tmp/html-lint | wc -l)"
          ls -la /tmp/sarif-lint/ || true
      - name: Upload lint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/sarif-lint
          category: android-lint
          wait-for-processing: false
        continue-on-error: true
      - name: Upload lint HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-report
          path: /tmp/html-lint/
          if-no-files-found: ignore

  detekt:
    name: detekt (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Download pinned detekt CLI
        run: |
          curl -sSfL -o /tmp/detekt-cli.jar \
            https://github.com/detekt/detekt/releases/download/v1.23.8/detekt-cli-1.23.8-all.jar
          echo "2ce2ff952e150baf28a29cda70a363b0340b3e81a55f43e51ec5edffc3d066c1  /tmp/detekt-cli.jar" | sha256sum -c -
      # Locally rehearsed 2026-11-23 on the main tree (a1e67cd77): 977 findings,
      # exit code 2 with valid SARIF written; exit 0 = clean. Findings (0/2)
      # never fail the job; any other exit, or a missing SARIF, is a tool
      # failure and fails the step honestly.
      - name: Run detekt (report-only)
        run: |
          set +e
          java -jar /tmp/detekt-cli.jar \
            --input . \
            --config .github/analysis/detekt-config.yml \
            --build-upon-default-config \
            --parallel \
            --excludes "**/build/**,**/res/**,**/.git/**" \
            --report sarif:/tmp/detekt.sarif \
            --report html:/tmp/detekt.html
          ec=$?
          set -e
          echo "detekt exit code: $ec"
          test "$ec" -eq 0 -o "$ec" -eq 2
          test -s /tmp/detekt.sarif
      - name: Upload detekt SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: /tmp/detekt.sarif
          category: detekt
          wait-for-processing: false
        continue-on-error: true
      - name: Upload detekt HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detekt-report
          path: /tmp/detekt.html
          if-no-files-found: ignore
