name: wren110-rel-runtime
# Release-variant runtime evidence for the frozen 1.10 candidate (3a00b001a = 1.10 (25)): release
# buildType (R8 minified, shrink off) signed with the committed debug keystore fallback
# (no secrets on this run), so the debug-signed androidTest APK can instrument it.
# CI-time patch adds proguard keeps (test binding) and debuggable=true: without it
# BuildConfig.DEBUG is false in release and the harness hooks (WBDBG receiver, WB18_NAV
# logs) do not exist, so the runtime suite cannot probe the app. Fixture therefore =
# release buildType + R8 + debug harness hooks; not byte-identical to the shipped APK.
# Candidate source tree is untouched (guard step below).
# retrigger r11 (T3b staging-transient poll + always-cleanup; positive-install -t flag for testOnly fixture + stderr capture)
on:
  push:
    branches: [instinct1/release-1.10.0-relruntime]
    paths: [.github/workflows/wren110-rel-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wren110-rel-runtime
  cancel-in-progress: false
jobs:
  runtime:
    if: github.repository == 'MtndaleRedneck/WrenBoard' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: 1.10.0 # r1
      VERSION_CODE: '11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify frozen app source
        run: |
          set -euo pipefail
          git cat-file -e 3a00b001af08995865a9d794a802cd577eaba410^{commit}
          test "$(git merge-base 3a00b001af08995865a9d794a802cd577eaba410 HEAD)" = "3a00b001af08995865a9d794a802cd577eaba410"
          git diff --name-only 3a00b001af08995865a9d794a802cd577eaba410 HEAD | sort > /tmp/wren-diff.txt
          printf '%s\n' .github/workflows/wren110-rel-runtime.yml tests/src/org/futo/inputmethod/latin/Wren110BackDispositionProbeTest.java tests/src/org/futo/inputmethod/latin/Wren110UpdaterProbeTest.java tests/src/org/futo/inputmethod/latin/Wren110UpdaterSettingsRouteProbeTest.java tests/src/org/futo/inputmethod/latin/Wren110RetentionProbeTest.java tests/src/org/futo/inputmethod/latin/Wren110NavBackDiagProbeTest.java tools/wren110-probe.sh tools/wren110-harness-lint.sh tools/wren110-t6-chip.py | sort > /tmp/wren-allowed.txt
          EXTRA=$(comm -23 /tmp/wren-diff.txt /tmp/wren-allowed.txt)
          test -z "$EXTRA" || { echo "frozen-source guard: unexpected changed files: $EXTRA"; exit 1; }
      - name: Harness preflight lint (seconds; catches probe-test accessor compile errors before the ~6-min fixture build)
        run: bash tools/wren110-harness-lint.sh
      - name: Build dependencies
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - name: Reuse shipped swipe weights for regression fixture
        run: |
          curl --http1.1 -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 180 -o /tmp/wren16.apk https://github.com/MtndaleRedneck/WrenBoard/releases/download/v1.6.0/WrenBoard-1.6.apk
          echo '89e3c3a7f756816bb36f391a4179405942738be9bd2ff12f3f9c4c87459f453f  /tmp/wren16.apk' | sha256sum -c -
          python3 - <<'PYWEIGHTS'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/wren16.apk') as z:
              files=[n for n in z.namelist() if n.startswith('assets/futo-swipe/') and not n.endswith('/')]
              assert files, 'Shipped weights absent'
              for n in files:
                  p=Path('java')/n
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(n))
          PYWEIGHTS
          rm /tmp/wren16.apk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and image tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          python3 -m pip install --break-system-packages pillow
          sudo apt-get install -y -q ffmpeg
      - name: CI-only fixture patch (keeps + debuggable; candidate source untouched)
        run: |
          cat > proguard-wren-test-keeps.pro <<'EOFKEEPS'
          -keep class org.futo.inputmethod.latin.LatinIME { *; }
          -keep class org.futo.inputmethod.latin.uix.** { *; }
          # probe binding only: isBusy/handOver/currentToken are never called by app code,
          # so R8 strips them (run 45321885141 T4 NoSuchMethodError). Fixture keep, not product.
          -keep class org.futo.inputmethod.updates.** { *; }
          EOFKEEPS
          python3 - <<'PYPATCH'
          from pathlib import Path
          p = Path('build.gradle')
          s = p.read_text()
          old = "proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'"
          new = "proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-wren-test-keeps.pro'"
          assert s.count(old) == 1, ('release proguardFiles line not found exactly once', s.count(old))
          s = s.replace(old, new)
          rel = "            minifyEnabled true\n            shrinkResources false"
          patched = "            minifyEnabled true\n            debuggable true\n            shrinkResources false"
          assert s.count(rel) == 1, ('release minify block not found exactly once', s.count(rel))
          p.write_text(s.replace(rel, patched))
          PYPATCH
          grep -n 'debuggable true' build.gradle
      - name: Build release fixture APK (debug keystore fallback, no secrets)
        run: |
          test ! -f keystore.properties
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process testStableDebugUnitTest :voiceinput-shared:testDebugUnitTest assembleStableRelease assembleStableDebugAndroidTest -Pandroid.injected.build.abi=x86_64 -Pandroid.injected.testOnly=false
          bash tools/ime-target/build.sh
          python3 - <<'PYAPK'
          from pathlib import Path
          import zipfile,hashlib,shutil
          app={}; tests={}
          for p in Path('build').rglob('*.apk'):
              try:
                  with zipfile.ZipFile(p) as z:
                      names=z.namelist()
                      if 'classes.dex' not in names: continue
                      isapp=any(n.startswith('lib/') and n.endswith('.so') for n in names)
                  digest=hashlib.sha256(p.read_bytes()).hexdigest()
                  (app if isapp else tests)[digest]=p
              except zipfile.BadZipFile: pass
          assert len(app)==1, ('expected one full app APK',list(app.values()))
          assert len(tests)==1, ('expected one test APK',list(tests.values()))
          shutil.copyfile(next(iter(app.values())), 'w17-release.apk')
          shutil.copyfile(next(iter(tests.values())), 'w17-rel-tests.apk')
          print('Resolved full app and test APKs',list(app.values()),list(tests.values()))
          PYAPK
          sha256sum w17-release.apk w17-rel-tests.apk
      - name: Build same-tree vc-12 update fixture (valid replacement - same source, same CI debug signer, higher versionCode)
        run: |
          set -euo pipefail
          VERSION_CODE=12 ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process assembleStableRelease -Pandroid.injected.build.abi=x86_64
          python3 - <<'PYAPK12'
          from pathlib import Path
          import zipfile,hashlib,shutil
          app={}
          for p in Path('build').rglob('*.apk'):
              try:
                  with zipfile.ZipFile(p) as z:
                      names=z.namelist()
                      if 'classes.dex' not in names: continue
                      if not any(n.startswith('lib/') and n.endswith('.so') for n in names): continue
                  app[hashlib.sha256(p.read_bytes()).hexdigest()]=p
              except zipfile.BadZipFile: pass
          assert len(app)==1, ('expected one full app APK',list(app.values()))
          shutil.copyfile(next(iter(app.values())), 'w17-vc12.apk')
          print('Resolved vc-12 update fixture',list(app.values()))
          PYAPK12
          sha256sum w17-vc12.apk
      - name: Repair TEST-apk classpath (inject kotlin-stdlib dex; app APK and its R8 output untouched)
        run: |
          set -euo pipefail
          # AGP excludes from the test APK any class it expects the app to supply; the R8-minified
          # app no longer defines kotlin-stdlib, so the test APK must carry it itself. d8 the
          # stdlib into one extra dex appended to the TEST apk only, then re-sign with the same
          # committed debug keystore (java/shared.keystore). No production keeps added.
          JARS=""
          for art in 'kotlin-stdlib-[0-9]*.jar' 'kotlin-stdlib-jdk7-[0-9]*.jar' 'kotlin-stdlib-jdk8-[0-9]*.jar' 'annotations-*.jar'; do
            J=$(find "$HOME/.gradle/caches/modules-2" -name "$art" ! -name '*sources*' ! -name '*javadoc*' 2>/dev/null | sort -V | tail -1 || true)
            [ -n "$J" ] && JARS="$JARS $J" && echo "input: $J"
          done
          test -n "$JARS"
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          AJAR="$ANDROID_HOME/platforms/$(ls "$ANDROID_HOME/platforms" | sort -V | tail -1)/android.jar"
          rm -rf /tmp/ktx && mkdir -p /tmp/ktx
          "$bt/d8" --min-api 24 --lib "$AJAR" --output /tmp/ktx $JARS
          # Actual-cause fix (verified against run 45313681341 fixture bytes): d8 preserves the
          # kotlin-stdlib multifile facade parts as package-private (as in the jar); R8 rewrote the
          # APP's facade calls into direct part references, so in the instrumented process the app's
          # references resolve against this injected dex and package-private parts throw
          # IllegalAccessError (e.g. SettingsKt -> kotlin.collections.SetsKt__SetsKt). Set ACC_PUBLIC
          # on every package-private class in the injected dex only (test-side fixture change; app
          # APK and its R8 output untouched), then repair dex checksums.
          python3 - <<'PYDEX'
          import struct, hashlib, zlib
          f = '/tmp/ktx/classes.dex'
          d = bytearray(open(f,'rb').read())
          cds, cdo = struct.unpack_from('<II', d, 0x60)
          flipped = 0
          for i in range(cds):
              base = cdo + i*32
              af = struct.unpack_from('<I', d, base+4)[0]
              if not (af & 0x1):
                  struct.pack_into('<I', d, base+4, af | 0x1)
                  flipped += 1
          d[12:32] = hashlib.sha1(bytes(d[32:])).digest()
          struct.pack_into('<I', d, 8, zlib.adler32(bytes(d[12:])))
          open(f,'wb').write(d)
          print(f"injected dex: set ACC_PUBLIC on {flipped} package-private classes")
          PYDEX
          N=$(unzip -Z1 w17-rel-tests.apk | grep -cE '^classes[0-9]*\.dex$')
          NEXT=$((N+1))
          echo "test apk dex count: $N; injecting as classes$NEXT.dex"
          cp /tmp/ktx/classes.dex "/tmp/ktx/classes$NEXT.dex"
          (cd /tmp/ktx && zip -q "$GITHUB_WORKSPACE/w17-rel-tests.apk" "classes$NEXT.dex")
          "$bt/apksigner" sign --ks java/shared.keystore --ks-pass pass:android --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false w17-rel-tests.apk
          sha256sum w17-rel-tests.apk
      - name: Verify fixture signatures match (same debug keystore)
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$bt/apksigner" verify --print-certs w17-release.apk | grep 'SHA-256' | sort > rel-signer.txt
          "$bt/apksigner" verify --print-certs w17-rel-tests.apk | grep 'SHA-256' | sort > test-signer.txt
          diff rel-signer.txt test-signer.txt
          "$bt/apksigner" verify --print-certs w17-vc12.apk | grep 'SHA-256' | sort > vc12-signer.txt
          diff rel-signer.txt vc12-signer.txt
      - name: Preserve fixture APKs and tests
        uses: actions/upload-artifact@v4
        with:
          name: wren110-rel-fixture
          path: |
            w17-release.apk
            w17-rel-tests.apk
            w17-vc12.apk
            build/test-results/
            voiceinput-shared/build/test-results/
          retention-days: 3
      - name: Install screenshot text locator
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr
      - name: Enable KVM
        if: always()
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Capture isolated runtime screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          disable-animations: false
          script: bash tools/wren18-runtime.sh w17-release.apk w17-rel-tests.apk

      - name: Diagnostics probes (disposition pipeline + updater lifecycle; frozen tools/wren18-runtime.sh untouched)
        # Independent of prior legs: probe + captures must still run (and fail visibly) if an
        # earlier step failed, so evidence is never silently skipped. But without the fixture
        # APKs there is nothing to probe: skip instead of spending ~10 min in the emulator
        # boot wait (r18 loss class). KVM runs if:always() above so a partial failure never
        # strips hardware acceleration from a run whose fixtures did build.
        if: always() && hashFiles('w17-release.apk') != '' && hashFiles('w17-rel-tests.apk') != '' && hashFiles('w17-vc12.apk') != '' && hashFiles('tools/ime-target/out/imetarget.apk') != ''
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          ram-size: 4096M
          disable-animations: false
          script: bash tools/wren110-probe.sh

      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wren110-rel-probe
          path: |
            probe-out.txt
            probe-out-t5a.txt
            probe-out-t5b.txt
            posinstall-out.txt
            probe-exit.txt
            probe-logcat-full.txt
            probe-dropbox-full.txt
            probe-anr-list.txt
            probe-anr/
            probe-files/
            probe-t6-strip.png
            probe-t6-after.png
            t6-chip.txt
            t6-field.txt
            navdiag-out.txt
            navdiag/
          retention-days: 3
          if-no-files-found: warn

      - name: Preserve synthetic runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wren110-rel-runtime
# Release-variant runtime evidence for the frozen 1.10 candidate (3a00b001a = 1.10 (25)): release
# buildType (R8 minified, shrink off) signed with the committed debug keystore fallback
# (no secrets on this run), so the debug-signed androidTest APK can instrument it.
# CI-time patch adds proguard keeps (test binding) and debuggable=true: without it
# BuildConfig.DEBUG is false in release and the harness hooks (WBDBG receiver, WB18_NAV
# logs) do not exist, so the runtime suite cannot probe the app. Fixture therefore =
# release buildType + R8 + debug harness hooks; not byte-identical to the shipped APK.
# Candidate source tree is untouched (guard step below).
          path: runtime18/
          retention-days: 3
