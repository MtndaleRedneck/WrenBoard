name: wren110-inventory
# dependency and tool inventory for the reviewed 1.10 fixture; build 1
on:
  push:
    branches: [instinct1/release-1.10.0-inventory]
    paths: [.github/workflows/wren110-inventory.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wren110-inventory
  cancel-in-progress: false
jobs:
  inventory:
    if: github.repository == 'MtndaleRedneck/WrenBoard' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: 1.10.0 # r1
      VERSION_CODE: '11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build dependencies
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - name: Reuse shipped swipe weights for regression fixture
        run: |
          curl --http1.1 -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 180 -o /tmp/wren16.apk https://github.com/MtndaleRedneck/WrenBoard/releases/download/v1.6.0/WrenBoard-1.6.apk
          echo '89e3c3a7f756816bb36f391a4179405942738be9bd2ff12f3f9c4c87459f453f  /tmp/wren16.apk' | sha256sum -c -
          python3 - <<'PYWEIGHTS'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/wren16.apk') as z:
              files=[n for n in z.namelist() if n.startswith('assets/futo-swipe/') and not n.endswith('/')]
              assert files, 'Shipped weights absent'
              for n in files:
                  p=Path('java')/n
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(n))
          PYWEIGHTS
          rm /tmp/wren16.apk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and image tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          python3 -m pip install --break-system-packages pillow
          sudo apt-get install -y -q ffmpeg
      - name: Tool versions
        run: |
          mkdir -p inv
          { java -version 2>&1; echo; git --version; python3 --version; python3 -m pip list 2>/dev/null | grep -i -E '^(pillow|pip) '; echo; ffmpeg -version 2>&1 | head -1 || true; echo "ANDROID_HOME=$ANDROID_HOME"; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list_installed 2>&1; lsb_release -a 2>&1; } > inv/tool-versions.txt
          sudo apt-get install -y -q tesseract-ocr >/dev/null && tesseract --version 2>&1 | head -3 >> inv/tool-versions.txt
          cat inv/tool-versions.txt
      - name: Build with dependency verification metadata
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process --write-verification-metadata sha256 assembleStableDebug assembleStableDebugAndroidTest testStableDebugUnitTest :voiceinput-shared:testDebugUnitTest -Pandroid.injected.build.abi=x86_64 -Pandroid.injected.testOnly=false
          cp gradle/verification-metadata.xml inv/ || true
          ./gradlew --no-daemon --version > inv/gradle-version.txt 2>&1 || true
          ./gradlew --no-daemon :dependencies --configuration stableDebugRuntimeClasspath > inv/app-runtime-deps.txt 2>&1 || true
          grep -c '<component ' inv/verification-metadata.xml
      - uses: actions/upload-artifact@v4
        with:
          name: wren110-inventory
          path: inv/
          retention-days: 3
