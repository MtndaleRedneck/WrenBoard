name: wren110-phone
# phone (arm64) build of the reviewed 1.10 fixture; same app code, only this file differs. build 1
on:
  push:
    branches: [instinct1/release-1.10.0-phone]
    paths: [.github/workflows/wren110-phone.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wren110-phone
  cancel-in-progress: false
jobs:
  phone:
    if: github.repository == 'MtndaleRedneck/WrenBoard' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION_NAME: 1.10.0 # r1
      VERSION_CODE: '11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build dependencies
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - name: Reuse shipped swipe weights for regression fixture
        run: |
          curl --http1.1 -fL --retry 4 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 180 -o /tmp/wren16.apk https://github.com/MtndaleRedneck/WrenBoard/releases/download/v1.6.0/WrenBoard-1.6.apk
          echo '89e3c3a7f756816bb36f391a4179405942738be9bd2ff12f3f9c4c87459f453f  /tmp/wren16.apk' | sha256sum -c -
          python3 - <<'PYWEIGHTS'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/wren16.apk') as z:
              files=[n for n in z.namelist() if n.startswith('assets/futo-swipe/') and not n.endswith('/')]
              assert files, 'Shipped weights absent'
              for n in files:
                  p=Path('java')/n
                  p.parent.mkdir(parents=True,exist_ok=True)
                  p.write_bytes(z.read(n))
          PYWEIGHTS
          rm /tmp/wren16.apk
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK and image tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358'
          python3 -m pip install --break-system-packages pillow
          sudo apt-get install -y -q ffmpeg
      - name: Build arm64 debug APK
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx5g -Dfile.encoding=UTF-8' -Pkotlin.compiler.execution.strategy=in-process assembleStableDebug -Pandroid.injected.build.abi=arm64-v8a -Pandroid.injected.testOnly=false
          python3 - <<'PYAPK'
          from pathlib import Path
          import zipfile,shutil
          app=[]
          for p in Path('build').rglob('*.apk'):
              with zipfile.ZipFile(p) as z:
                  n=z.namelist()
                  if 'classes.dex' in n and any(x.startswith('lib/arm64-v8a/') for x in n): app.append(p)
          assert len(app)==1, app
          shutil.copyfile(app[0],'WrenBoard-1.10-test-arm64.apk')
          PYAPK
          sha256sum WrenBoard-1.10-test-arm64.apk
          unzip -l WrenBoard-1.10-test-arm64.apk | grep 'lib/' | awk '{print $4}' | cut -d/ -f2 | sort | uniq -c
      - uses: actions/upload-artifact@v4
        with:
          name: wren110-phone-apk
          path: WrenBoard-1.10-test-arm64.apk
          retention-days: 3
