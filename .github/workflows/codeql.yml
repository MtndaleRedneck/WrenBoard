# CodeQL security scan for WrenBoard (java-kotlin).
# Kotlin has no buildless mode: init must use build-mode manual + a real Gradle build.
# Triggers on PRs to main + weekly schedule + manual dispatch; pushing this file does not run it.
name: CodeQL

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 * * 2'   # weekly, Tuesday 05:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: 1.10.0   # build.gradle requires VERSION_CODE/VERSION_NAME env (defaults to -1)
      VERSION_CODE: "11"
    permissions:
      security-events: write   # upload results to the Security tab
      contents: read
      actions: read            # read workflow run metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.4.0 (SHA spot-verified 2026-11-23)
      - name: Init build submodules (same set as build.yml)
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v4.9.1 (SHA spot-verified 2026-11-23)
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK (runner-provided Android SDK)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v3.5.0 (SHA spot-verified 2026-11-23)
      - uses: github/codeql-action/init@v4   # moving major, deliberate per kit
        with:
          languages: java-kotlin
          build-mode: manual
      # Daemon and build cache make CodeQL miss classes or hang; keep them off.
      # stableDebug only: no signing secrets needed (keystore.properties has a guarded fallback in root build.gradle).
      - name: Build for CodeQL
        run: ./gradlew --no-daemon --no-build-cache assembleStableDebug
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
