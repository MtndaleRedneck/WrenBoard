name: instr-tests
on:
  workflow_dispatch:
    inputs:
      classes:
        description: "comma-separated test classes"
        required: false
        default: "org.futo.inputmethod.keyboard.internal.KeyboardStateShiftCycleTests,org.futo.inputmethod.keyboard.internal.KeyboardStateMultiTouchTests,org.futo.inputmethod.keyboard.internal.KeyboardStateSingleTouchTests"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION_NAME: 0.1.0-baseline
      VERSION_CODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Init build submodules
        run: git submodule update --init java/assets/themes java/res-large libs translations voiceinput-shared/src/main/ml
      - name: Init swipe model submodule (FUTO Swipe weights, FUTO Model Weights License 1.0; notice in Settings > Credits)
        run: |
          set -e
          git lfs install
          GIT_LFS_SKIP_SMUDGE=1 git submodule update --init java/assets/futo-swipe
          cd java/assets/futo-swipe
          git lfs pull --include="honorable_sturgeon/*,hungry_jellyfish/*,magic_macaw/*"
          # demo animation and model card are not app assets; LICENSE.md stays (shown in Credits)
          rm -rf animations README.md .gitattributes
          for f in honorable_sturgeon/model_fp32.pte magic_macaw/model_fp32.pte hungry_jellyfish/context_lm.pte; do
            sz=$(stat -c%s "$f"); echo "$f $sz bytes"
            if [ "$sz" -lt 100000 ]; then echo "swipe model $f is an LFS pointer, not the weights"; exit 1; fi
          done
          echo "725242bab5d14345e96ff214e8de2bfbc1f962c232d320df9c24cb82ffd1fbaf  honorable_sturgeon/model_fp32.pte" | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented keyboard-state tests
        env:
          WB_CLASSES: ${{ inputs.classes }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: ./gradlew --no-daemon connectedStableDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=$WB_CLASSES
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instr-test-reports
          path: |
            build/reports/androidTests/
            build/outputs/androidTest-results/
          retention-days: 14
